# ==============================================================================
# PAGES CMS CONFIGURATION (https://pagescms.org)
# THE MARKETING CLUB (MAC) | SRI VENKATESWARA COLLEGE, UNIVERSITY OF DELHI
# ==============================================================================

# 1. MULTIMODAL MEDIA REPOSITORIES
media:
  - name: images
    label: "Images & Visual Assets"
    input: public/uploads/images
    output: /uploads/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, svg, gif]

  - name: videos
    label: "Video Clips & Teasers"
    input: public/uploads/videos
    output: /uploads/videos
    categories: [video]
    extensions: [mp4, webm, mov]

  - name: documents
    label: "PDFs, Decks & Documents"
    input: public/uploads/documents
    output: /uploads/documents
    categories: [document, compressed]
    extensions: [pdf, pptx, docx, xlsx, zip]

