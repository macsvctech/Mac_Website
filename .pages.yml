            label: Mobile Index Number (e.g. 06)
            type: string
          - name: mobileLabel
            label: Mobile Menu Item Label
            type: string
          - name: mobileActiveBadge
            label: Mobile Active Badge Text
            type: string
          - name: mobileInactiveBadge
            label: Mobile Inactive Badge Text
            type: string
      - name: mobileMenu
        label: Mobile Navigation Drawer Settings
        type: object
        fields:
          - name: openText
            label: Hamburger Button Closed State Text
            type: string
          - name: closeText
            label: Hamburger Button Open State Text
            type: string
          - name: activeBadge
            label: Active Item Badge
            type: string
          - name: openBadge
            label: Inactive Item Badge
