  - name: testimonials
    label: "🎙️ Testimonials: Alumni President & Member Exit Dossiers"
    type: collection
    path: src/content/testimonials
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields:
        - name
        - role
        - badgeId
      sort: order
    fields:
      - name: enabled
        label: Visible on Website? (Toggle ON/OFF)
        type: boolean
        default: true
        description: Toggle ON to display this section on the live website. Toggle OFF to hide it without deleting data.
      - name: order
        label: Display Order Index
        type: number
        description: Display priority number (e.g. 1, 2, 3). Items with lower numbers appear first on the page.
      - name: name
        label: Alumni President Name
        type: string
        required: true
      - name: role
        label: Executive Tenure Office
        type: string
        required: true
      - name: badgeId
        label: Dossier Badge ID (e.g. ID // PRES_25-26)
        type: string
      - name: pullQuote
        label: Featured Pull Quote
        type: text
      - name: fullLetter
        label: Full Declassified Exit Letter Paragraphs
        type: text
        list: true
      - name: portraitImage
        label: Alumni ID Portrait (Square 1:1)
        type: image
        options:
          media: images
        description: Square 1:1 ratio headshot (e.g. 600x600). Crisp face crop on neutral background. Recommended .webp or .jpg under 1MB.
      - name: videoTestimonialUrl
        label: Video Testimonial / Interview (.mp4 / YouTube)
        type: string
      - name: linkedinUrl
        label: LinkedIn Profile URL
        type: string
      - name: defaultOpen
        label: Expand Accordion by Default?
        type: boolean
