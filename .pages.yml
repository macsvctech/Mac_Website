            label: Broadcast Banner Across All Pages?
            type: boolean
            description: Toggle ON to show the yellow high-visibility alert bar across all pages.
          - name: text
            label: Marquee Announcement Text
            type: string
          - name: link
            label: Banner Destination URL / Anchor
            type: string
      - name: navigation
        label: Header Navigation Menu Links
        type: object
        list: true
        fields:
