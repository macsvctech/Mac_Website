media:
  - name: images
    label: "🖼️ Image Assets (Uploads to public/uploads/images)"
    input: public/uploads/images
    output: /uploads/images
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - svg
      - gif
  - name: videos
    label: "🎬 Video Assets (Uploads to public/uploads/videos)"
    input: public/uploads/videos
    output: /uploads/videos
    categories:
      - video
    extensions:
      - mp4
      - webm
      - mov
  - name: documents
    label: "📄 Documents & PDFs (Uploads to public/uploads/documents)"
    input: public/uploads/documents
    output: /uploads/documents
    categories:
      - document
      - compressed
    extensions:
      - pdf
      - pptx
      - docx
      - xlsx
      - zip
content:
  - name: global_settings
    label: 📢 Global Brand, Logo, Caution Ticker & Footer
    type: file
    path: src/content/settings/global.json
    format: json
    fields:
      - name: siteTitle
        label: Official Site Title
        type: string
        required: true
      - name: shortTitle
        label: Short Title
        type: string
      - name: college
        label: College Affiliation
        type: string
      - name: university
        label: University System
        type: string
      - name: tagline
        label: Tactical Tagline
        type: string
      - name: estYear
        label: Founding Year
        type: string
      - name: email
        label: Society Primary Inbound Email
        type: string
      - name: phone
        label: Primary Operational Phone
        type: string
      - name: address
        label: Physical Headquarters Address
        type: text
      - name: logoUrl
        label: Official Vector/Raster Logo
        type: image
        options:
          media: images
        description: Main society logo displayed in top navigation. Transparent PNG or SVG (~400x120px).
      - name: faviconUrl
        label: Browser Favicon Asset
        type: image
        options:
          media: images
        description: Browser tab icon (.ico, .png, or .svg). Recommended square 32x32 or 64x64.
      - name: brochurePdfEnabled
        label: "Enable Brochure PDF Download Button?"
        type: boolean
        default: false
        description: "Toggle ON to show the society brochure PDF download button in the footer. Toggle OFF to hide it completely when no PDF is uploaded."
      - name: brochurePdfUrl
        label: Society Brochure PDF File
        type: file
        options:
          media: documents
        description: Official society brochure PDF for header download button. Under 10MB.
      - name: brochureLabel
        label: Society Brochure Button Label
        type: string
      - name: socials
        label: Official Social Coordinates
        type: object
        fields:
          - name: instagram
            label: Instagram Profile URL
            type: string
          - name: linkedin
            label: LinkedIn Organization URL
            type: string
      - name: recruitmentBanner
        label: Top Caution-Tape Marquee Ticker
        type: object
        fields:
